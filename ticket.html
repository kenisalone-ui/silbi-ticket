<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SILBI Ticket</title>

    <style>
        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
            color: #003366;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .ticket {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .hello {
            font-size: 20px;
            font-weight: bold;
        }

        .thankyou {
            margin-top: 8px;
            font-size: 16px;
            color: #555;
        }

        .label {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }

        .queue {
            font-size: 48px;
            font-weight: bold;
            margin: 8px 0 20px;
        }

        .service {
            font-size: 20px;
            font-weight: bold;
        }

        .type {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 18px;
            border-radius: 20px;
            background: #99ccff;
            color: #003366;
            font-weight: bold;
        }

        .info {
            margin-top: 30px;
            font-size: 15px;
            line-height: 1.8;
        }

        .wait {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .message {
            margin-top: 35px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="ticket">

        <div class="logo">SILBI</div>

        <div class="hello" id="hello">
            Kumusta!
        </div>

        <div class="thankyou">
            Thank you for queuing!
        </div>

        <div class="label">
            Your queuing no.
        </div>

        <div class="queue" id="queue">
            BC-001
        </div>

        <div class="service" id="service">
            Barangay Clearance
        </div>

        <div class="type" id="type">
            Regular
        </div>

        <div class="info">
            <div>
                <b>Date</b><br>
                <span id="date"></span>
            </div>

            <div>
                <b>Time</b><br>
                <span id="time"></span>
            </div>
        </div>

        <div class="wait">
            Estimated Wait:<br>
            <span id="wait">30 minutes</span>
        </div>

        <div class="message">
            Thank you for waiting!
        </div>

    </div>

</body>
</html>
