<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SILBI Ticket</title>

        <style>
            body {
                margin: 0;
                background: linear-gradient(
                    135deg,
                    #ffe1e1,
                    #fff4dc,
                    #e8f2ff
                );
                font-family: Arial, sans-serif;
                color: #003366;
                display: flex;
                justify-content: center;
                padding: 30px 15px;
                min-height: 100vh;
                box-sizing: border-box;
            }

            .ticket {
                width: 100%;
                max-width: 400px;
                text-align: center;
                background: white;
                border-radius: 25px;
                padding: 30px 25px 25px;
                box-sizing: border-box;
                box-shadow: 0 8px 25px rgba(0, 51, 102, 0.15);
            }

            .logo {
                margin-bottom: 20px;
            }

            .logo img {
                width: 150px;
                max-width: 70%;
                height: auto;
            }

            .hello {
                font-size: 20px;
                font-weight: bold;
            }

            .thankyou {
                margin-top: 8px;
                font-size: 16px;
                color: #555;
            }

            .label {
                margin-top: 30px;
                font-size: 14px;
                color: #777;
            }

            .queue {
                font-size: 48px;
                font-weight: bold;
                margin: 8px 0 20px;
                color: #003366;
            }

            .service {
                font-size: 20px;
                font-weight: bold;
            }

            .type {
                display: inline-block;
                margin-top: 10px;
                padding: 8px 18px;
                border-radius: 20px;
                background: #99ccff;
                color: #003366;
                font-weight: bold;
            }

            .info {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #d9e4ef;
                font-size: 15px;
                line-height: 1.8;
            }

            .wait {
                margin-top: 25px;
                padding: 15px;
                border-radius: 15px;
                background: #e8f3ff;
                font-size: 18px;
                font-weight: bold;
                color: #003366;
            }

            .message {
                margin-top: 25px;
                color: #666;
                font-size: 14px;
            }

            .bottom-image {
                margin-top: 25px;
                width: 100%;
                border-radius: 18px;
                display: block;
            }
        </style>
    </head>

    <body>

        <div class="ticket">

            <div class="logo">
                <img src="silbi-logo.png" alt="SILBI Logo">
            </div>

            <div class="hello" id="hello">
                Kumusta!
            </div>

            <div class="thankyou">
                Thank you for queuing!
            </div>

            <div class="label">
                Your queuing no.
            </div>

            <div class="queue" id="queue"></div>

            <div class="service" id="service"></div>

            <div class="type" id="type"></div>

            <div class="info">
                <div>
                    <b>Date</b><br>
                    <span id="date"></span>
                </div>

                <div>
                    <b>Queue Generated</b><br>
                    <span id="time"></span>
                </div>
            </div>

            <div class="wait">
                Estimated Wait:<br>
                <span id="wait"></span>
            </div>

            <div class="message">
                Thank you for waiting!
            </div>

            <img
                class="bottom-image"
                src="bottom-image.png"
                alt="SILBI"
            >

        </div>

        <script>
            const params = new URLSearchParams(window.location.search);

            const name = params.get("name");
            const queue = params.get("queue");
            const service = params.get("service");
            const type = params.get("type");
            const date = params.get("date");
            const time = params.get("time");
            const wait = params.get("wait");
            const expires = params.get("expires");

            if (expires && Date.now() > Number(expires)) {

                document.querySelector(".ticket").innerHTML = `
                    <div class="logo">
                        <img
                            src="silbi-logo.png"
                            alt="SILBI Logo"
                            style="width:150px; max-width:70%;"
                        >
                    </div>

                    <div style="
                        font-size: 24px;
                        font-weight: bold;
                        margin-top: 50px;
                    ">
                        Ticket Expired
                    </div>

                    <div style="
                        margin-top: 15px;
                        color: #666;
                        font-size: 15px;
                        line-height: 1.6;
                    ">
                        This queue ticket is no longer valid.<br>
                        Queue tickets are valid for 7 days.
                    </div>

                    <img
                        src="bottom-image.png"
                        alt="SILBI"
                        style="
                            width:100%;
                            margin-top:30px;
                            border-radius:18px;
                        "
                    >
                `;

            } else {

                if (name) {
                    document.getElementById("hello").textContent =
                        "Kumusta, " + name + "!";
                }

                if (queue) {
                    document.getElementById("queue").textContent = queue;
                }

                if (service) {
                    document.getElementById("service").textContent = service;
                }

                if (type) {
                    document.getElementById("type").textContent = type;
                }

                if (date) {
                    document.getElementById("date").textContent = date;
                }

                if (time) {
                    document.getElementById("time").textContent = time;
                }

                if (wait) {
                    document.getElementById("wait").textContent = wait;
                }
            }
        </script>

    </body>
</html>
